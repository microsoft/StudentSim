# Stage 2 (per-student specialization) -- L2.
# 15 learners x 73 instances/student (58 ST + 15 MT, rho=0.20) x 3 epochs at
# effective_batch=8 -> ~30 grad steps per learner (73 / 8 * 3 ≈ 27).

base_model: Qwen/Qwen3-4B-Instruct-2507
stage: 2

data_path: l2/stage2/{student_id}.jsonl
output_dir: l2/stage2/{student_id}
initial_adapter: l2/stage1/adapter

# L2 Stage 2 uses a smaller effective batch because per-student
# datasets are two orders of magnitude smaller than the pooled corpus; small
# batch ensures multiple optimizer steps per epoch.
per_device_batch: 1
gradient_accumulation: 1
world_size: 8
effective_batch: 8

max_seq_len: 4096
precision: bf16
gradient_checkpointing: true

epochs: 3.0
multi_turn_ratio: 0.20      # 15 MT + 58 ST per learner = 73 total; rho=0.20
save_freq: 10
save_total_limit: 3

trainer_seed: 42
data_sampler_seed: 42

lora:
  rank: 128
  alpha: 256
  dropout: 0.05
  target_modules:
    - q_proj
    - k_proj
    - v_proj
    - o_proj
    - gate_proj
    - up_proj
    - down_proj

optimizer:
  name: adamw_torch_fused
  learning_rate: 5.0e-5
  beta1: 0.9
  beta2: 0.95
  weight_decay: 0.1
  grad_clip: 1.0
  schedule: cosine
  warmup_steps: 30
