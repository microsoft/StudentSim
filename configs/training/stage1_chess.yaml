# Stage 1 (pooled training) — chess.
# Corpus: 100,000 instances pooled across 100 Stage-1 players. Multi-turn ratio 0.20.

base_model: Qwen/Qwen3-4B-Instruct-2507
stage: 1

# Paths are relative to STUDENTSIM_DATA_DIR / STUDENTSIM_CKPT_DIR.
# A real run will substitute these via env-var rendering or the CLI.
data_path: chess/stage1_pooled.jsonl
output_dir: chess/stage1

per_device_batch: 4
gradient_accumulation: 8
world_size: 8
effective_batch: 256

max_seq_len: 4096
precision: bf16
gradient_checkpointing: true

epochs: 1.0
multi_turn_ratio: 0.20
save_freq: 200
save_total_limit: 3

trainer_seed: 42
data_sampler_seed: 42

lora:
  rank: 128
  alpha: 256
  dropout: 0.05
  target_modules:
    - q_proj
    - k_proj
    - v_proj
    - o_proj
    - gate_proj
    - up_proj
    - down_proj

optimizer:
  name: adamw_torch_fused
  learning_rate: 1.0e-4
  beta1: 0.9
  beta2: 0.95
  weight_decay: 0.1
  grad_clip: 1.0
  schedule: cosine
  warmup_steps: 100
