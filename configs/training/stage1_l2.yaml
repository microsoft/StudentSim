# Stage 1 (pooled training) -- L2.
# Corpus: 7,800 instances pooled across 200 Stage-1 learners. Multi-turn ratio 0.20.
# L2 Stage 1 trains for 3 epochs (not 1) because one epoch yields only ~31 grad steps
# at 7,800 instances / effective_batch 256; 3 epochs bring it to ~93 steps, comparable
# to chess (391) and math (91) at a single epoch.

base_model: Qwen/Qwen3-4B-Instruct-2507
stage: 1

data_path: l2/stage1_pooled.jsonl
output_dir: l2/stage1

# Shared with chess Stage 1.
per_device_batch: 4
gradient_accumulation: 8
world_size: 8
effective_batch: 256

max_seq_len: 4096
precision: bf16
gradient_checkpointing: true

epochs: 3.0
multi_turn_ratio: 0.20
save_freq: 50
save_total_limit: 3

trainer_seed: 42
data_sampler_seed: 42

lora:
  rank: 128
  alpha: 256
  dropout: 0.05
  target_modules:
    - q_proj
    - k_proj
    - v_proj
    - o_proj
    - gate_proj
    - up_proj
    - down_proj

optimizer:
  name: adamw_torch_fused
  learning_rate: 1.0e-4
  beta1: 0.9
  beta2: 0.95
  weight_decay: 0.1
  grad_clip: 1.0
  schedule: cosine
  warmup_steps: 100
